<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 태그</title>
</head>
<body>
    <form>
        <!-- 글자를 입력 -->
        <input type="text" placeholder="아이디">
        <!-- 비밀번호 입력 -->
        <input type="password" placeholder="비밀번호">
        <!-- 메일 입력 -->
        <input type="email" placeholder="이메일">
        <!-- 숫자 입력 -->
        <input type="number" min="1" max="10">
        <!-- 인터넷 주소 입력 -->
        <input type="url" placeholder="https://example.com">
        <!-- 검색 입력 -->
        <input type="search" placeholder="search">
        <!-- 네모 : 여러개 선택 -->
        <input type="checkbox">
        <input type="checkbox">
        <input type="checkbox">
        <!-- 동그라미 : 하나만 선택 -->
        <input type="radio" name="gender">
        <input type="radio" name="gender">
        <input type="radio" name="gender">
        <!-- 파일 선택 -->
        <input type="file">
        <!-- 그냥 버튼 (눌러도 아무 일도 안 일어남) -->
        <input type="button" value="로그인">
        <button type="submit"제출></button>
        <!-- 사진 모양의 버튼 -->
        <input type="image" src="KakaoTalk_261008_111724.png">
        <!-- 화면에 안 보이지만 몰래 값을 저장하는 -->
        <input type="hidden">
        <!-- 날짜 선택 -->
        <input type="date">
        <!-- 날짜랑 시간 같이 선택 -->
        <input type="datetime-local">
        <!-- 연도와 월을 선택 -->
        <input type="month">
        <!-- 몇 번째 주 선택 -->
        <input type="week">
        <!-- 시간 선택 -->
        <input type="time">
        <!-- 막대를 움직여서 값 선택 -->
        <input type="range">
        <!-- 색 선택 -->
        <input type="color">
        <!-- 글쓰기 -->
        <textarea></textarea>
    </form>
</body>
</html>
