<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변형</title>
    <link rel="stylesheet" href="css/transform.css">
  </head>
  <body>
    <!-- 이동 변형 -->
    <div class="container">
        <!-- x 방향으로 이동 -->
        <div class="orign">
            <div class="movex"></div>
        </div>
        <!-- y 방향으로 이동 -->
        <div class="orign">
            <div class="movey"></div>
        </div>
        <!-- xy 방향으로 이동 -->
        <div class="orign">
            <div class="movexy"></div>
        </div>
    </div>
     <!-- 확대 축소 변형 -->
    <div class="container">
        <!-- x 방향으로 이동 -->
        <div class="orign">
            <div class="scalex"></div>
        </div>
        <!-- y 방향으로 이동 -->
        <div class="orign">
            <div class="scaley"></div>
        </div>
        <!-- xy 방향으로 이동 -->
        <div class="orign">
            <div class="scale"></div>
        </div>
    </div>
    <!-- 회전 변형 -->
    <div class="container">
        <div class="origin" id="rotate1">
            <img src="KakaoTalk_261007_093409.jpg" alt="나무">
        </div>
        <div class="origin" id="rotate2">
            <img src="KakaoTalk_261007_093409.jpg" alt="나무">
        </div>
    </div>
    <!-- 3D 회전 변형 -->
    <div class="container">
        <div class="origin" id="rotate3">
            <img src="KakaoTalk_261007_093409.jpg" alt="나무">
        </div>
        <div class="origin" id="rotate4">
            <img src="KakaoTalk_261007_093409.jpg" alt="나무">
        </div>
    </div>
    <!-- 비틀기 변형 -->
    <div class="container">
        <!-- x 방향으로 이동 -->
        <div class="orign">
            <div class="skewx"></div>
        </div>
        <!-- y 방향으로 이동 -->
        <div class="orign">
            <div class="skewy"></div>
        </div>
        <!-- xy 방향으로 이동 -->
        <div class="orign">
            <div class="skewxy"></div>
        </div>
    </div>
  </body>
</html>
