<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주도</title>
    <link rel="stylesheet" href="main2.css">
</head>
<body>
    <!-- 전체 레이아웃 -->
    <div class="layout">
        <!-- 상단 -->
        <header>
            <!-- 로고 -->
            <a href="#" class="logo">JeJu!</a>
            <!-- 메뉴 -->
            <nav>
                <a href="#">제주 이야기</a>
                <a href="#">제주 기록</a>
                <a href="#">갤러리</a>
                <a href="#">다시, 제주</a>
            </nav>
        </header>
        <!-- 메인 -->
        <main>
            <!-- 최근에 다녀온 제주 -->
            <section>
                <h2>최근에 다녀온 제주</h2>
                <!-- 전체 설명 -->
                <div class="description">
                    <!-- 이미지 -->
                    <div class="desc-img">
                        <img src="KakaoTalk_261002_165431.jpeg" alt="">
                    </div>
                    <!-- 자세한 설명 -->
                    <div class="desc-detail">
                        <!-- 자세한 설명 상단 -->
                        <div class="detial-top">
                            <h3>📍무릉소운</h3>
                            <p>Check-in 16:00 / Check-out 11:00</p>
                        </div>
                        <!-- 자세한 설명 하단 -->
                        <div class="detial-bt">
                            <h4>다녀온 날</h4>
                            <p>2026년 6월 23일 (화) ~ 24일 (수)</p>
                        </div>
                    </div>
                </div>
            </section>
            <!-- 가보고 싶은 제주 -->
            <section>
                <!-- 전체 설명 -->
                <div class="description">
                    <!-- 이미지 -->
                    <div class="desc-img">
                        <img src="KakaoTalk_261002_165442.jpeg" alt="">
                    </div>
                    <!-- 자세한 설명 -->
                    <div class="desc-detail">
                        <!-- 자세한 설명 상단 -->
                        <div class="detial-top">
                            <h3>📍슬로우 말차</h3>
                            <p>- 슬로우 말차 라떼 6,500원
                               <br> - 슬로우 말차 워터 6,000원                                
                            </p>
                        </div>
                        <!-- 자세한 설명 하단 -->
                        <div class="detial-bt">
                            <h4>다녀온 날</h4>
                            <p>2026년 6월 24일 (수)</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- 하단 -->
        <footer>
            <nav>
                <a href="#">회사 소개</a>
                <a href="#">개인정보 처리 방침</a>
                <a href="#"></a>
                <a href="#"></a>
            </nav>
        </footer>
    </div>
</body>
</html>
